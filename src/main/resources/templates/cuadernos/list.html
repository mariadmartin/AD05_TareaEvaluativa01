<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis cuadernos')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Mis cuadernos</h1>
        <a class="btn btn-primary" th:href="@{/cuadernos/nuevo}">
            <i class="bi bi-plus-lg me-1"></i>Nuevo cuaderno
        </a>
    </div>

    <div th:if="${mensaje != null}" class="alert alert-info" th:text="${mensaje}"></div>

    <div th:if="${#lists.isEmpty(cuadernos)}" class="alert alert-secondary">
        Todavia no tienes ningun cuaderno. Crea el primero con el boton de arriba.
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="cuaderno : ${cuadernos}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-1" th:text="${cuaderno.titulo}">Titulo</h5>
                    <h6 class="card-subtitle text-muted" th:text="${cuaderno.materia}">Materia</h6>
                </div>
                <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center pb-3">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/notas(cuadernoId=${cuaderno.id})}">
                        <i class="bi bi-journal-text me-1"></i>Notas
                    </a>
                    <div class="btn-group" role="group">
                        <a class="btn btn-sm btn-outline-primary" title="Editar"
                           th:href="@{/cuadernos/{id}/editar(id=${cuaderno.id})}">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                        <form th:action="@{/cuadernos/{id}/eliminar(id=${cuaderno.id})}" method="post"
                              class="d-inline" onsubmit="return confirm('Eliminar este cuaderno y todas sus notas?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
