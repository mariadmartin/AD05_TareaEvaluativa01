<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis cuadernos')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Mis cuadernos</h1>
        <a class="btn btn-primary" th:href="@{/cuadernos/nuevo}">
            <i class="bi bi-plus-lg me-1"></i>Nuevo cuaderno
        </a>
    </div>

    <div th:if="${mensaje != null}" class="alert alert-info" th:text="${mensaje}"></div>

    <div th:if="${#lists.isEmpty(cuadernos)}" class="alert alert-secondary">
        Todavia no tienes ningun cuaderno. Crea el primero con el boton de arriba.
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="cuaderno : ${cuadernos}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-1" th:text="${cuaderno.titulo}">Titulo</h5>
                    <h6 class="card-subtitle text-muted" th:text="${cuaderno.materia}">Materia</h6>
                </div>
                <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center pb-3">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/notas(cuadernoId=${cuaderno.id})}">
                        <i class="bi bi-journal-text me-1"></i>Notas
                    </a>
                    <div class="btn-group" role="group">
                        <a class="btn btn-sm btn-outline-primary" title="Editar"
                           th:href="@{/cuadernos/{id}/editar(id=${cuaderno.id})}">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                        <button type="button" class="btn btn-sm btn-outline-danger" title="Eliminar"
                                data-bs-toggle="modal" data-bs-target="#modalEliminarCuaderno"
                                th:data-url="@{/cuadernos/{id}/eliminar(id=${cuaderno.id})}"
                                th:data-titulo="${cuaderno.titulo}">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEliminarCuaderno" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Eliminar cuaderno</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p>
                        ¿Seguro que quieres eliminar el cuaderno
                        <strong id="modalEliminarCuadernoTitulo"></strong>?
                        Se eliminaran tambien <strong>todas sus notas</strong>. Esta accion no se puede deshacer.
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form id="formEliminarCuaderno" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    document.getElementById('modalEliminarCuaderno').addEventListener('show.bs.modal', function (evento) {
        var boton = evento.relatedTarget;
        document.getElementById('formEliminarCuaderno').setAttribute('action', boton.getAttribute('data-url'));
        document.getElementById('modalEliminarCuadernoTitulo').textContent = boton.getAttribute('data-titulo');
    });
</script>

</body>
</html>
