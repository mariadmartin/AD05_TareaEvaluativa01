<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${cuaderno.id} == null ? 'Nuevo cuaderno' : 'Editar cuaderno')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container pb-5" style="max-width: 640px;">

    <h1 class="h3 mb-4" th:text="${cuaderno.id} == null ? 'Nuevo cuaderno' : 'Editar cuaderno'">Cuaderno</h1>

    <form th:object="${cuaderno}"
          th:action="${cuaderno.id} == null ? @{/cuadernos/nuevo} : @{/cuadernos/{id}/editar(id=${cuaderno.id})}"
          method="post" class="card shadow-sm border-0 p-4">

        <div class="mb-3">
            <label class="form-label" for="titulo">Titulo</label>
            <input type="text" class="form-control" id="titulo" th:field="*{titulo}"
                   th:errorclass="is-invalid" maxlength="100">
            <div class="invalid-feedback" th:errors="*{titulo}"></div>
        </div>

        <div class="mb-4">
            <label class="form-label" for="materia">Materia</label>
            <input type="text" class="form-control" id="materia" th:field="*{materia}"
                   th:errorclass="is-invalid" maxlength="60">
            <div class="invalid-feedback" th:errors="*{materia}"></div>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/cuadernos}">Cancelar</a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i>Guardar
            </button>
        </div>

    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
