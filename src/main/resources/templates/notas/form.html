<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${nota.id} == null ? 'Nueva nota' : 'Editar nota')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container pb-5" style="max-width: 640px;">

    <h1 class="h3 mb-4" th:text="${nota.id} == null ? 'Nueva nota' : 'Editar nota'">Nota</h1>

    <form th:object="${nota}"
          th:action="${nota.id} == null ? @{/notas/nueva} : @{/notas/{id}/editar(id=${nota.id})}"
          method="post" class="card shadow-sm border-0 p-4">

        <div th:if="${errorCuaderno != null}" class="alert alert-danger" th:text="${errorCuaderno}"></div>

        <div class="mb-3">
            <label class="form-label" for="cuadernoId">Cuaderno</label>
            <select class="form-select" id="cuadernoId" name="cuadernoId">
                <option th:each="c : ${cuadernos}"
                        th:value="${c.id}"
                        th:selected="${c.id} == ${cuadernoIdSeleccionado}"
                        th:text="${c.titulo}">Cuaderno</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="titulo">Titulo</label>
            <input type="text" class="form-control" id="titulo" th:field="*{titulo}"
                   th:errorclass="is-invalid" maxlength="100">
            <div class="invalid-feedback" th:errors="*{titulo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="fecha">Fecha</label>
            <input type="date" class="form-control" id="fecha" th:field="*{fecha}"
                   th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{fecha}"></div>
        </div>

        <div class="mb-4">
            <label class="form-label" for="contenido">Contenido</label>
            <textarea class="form-control" id="contenido" rows="6" th:field="*{contenido}"
                      th:errorclass="is-invalid" maxlength="2000"></textarea>
            <div class="invalid-feedback" th:errors="*{contenido}"></div>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/notas}">Cancelar</a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i>Guardar
            </button>
        </div>

    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
